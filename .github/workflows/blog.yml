name: Update blog posts (rss2json)

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 UTC 00:00 (KST 09:00)
  workflow_dispatch:

permissions:
  contents: write  # README 커밋을 위해 필요

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build blog list with rss2json
        id: build
        shell: bash
        run: |
          set -euo pipefail
          FEED_URL="https://api.rss2json.com/v1/api.json?rss_url=https://cherryberry0327.tistory.com/rss"

          # RSS → JSON
          if ! JSON="$(curl -fsSL "$FEED_URL")"; then
            echo "❌ rss2json 요청 실패"; exit 1
          fi

          # 최근 5개 제목+링크 → 마크다운 리스트
          LIST="$(python3 - <<'PY'
import sys, json
try:
    data = json.load(sys.stdin)
except Exception as e:
    print("JSON parse error:", e, file=sys.stderr); sys.exit(1)

items = data.get("items", [])[:5]
out = []
for it in items:
    title = (it.get("title") or "(no title)").replace("\n"," ").strip()
    url = it.get("link") or "#"
    out.append(f"- [{title}]({url})")
print("\n".join(out))
PY
          <<<"$JSON")"

          # 비어있으면 실패 처리(선택)
          if [ -z "$LIST" ]; then
            echo "피드에 항목이 없거나 파싱 실패"; exit 1
          fi

          {
            echo "list<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Inject into README
        shell: bash
        run: |
          set -euo pipefail
          FILE="README.md"
          START="<!-- BLOG-POST-LIST:START -->"
          END="<!-- BLOG-POST-LIST:END -->"
          LIST="${{ steps.build.outputs.list }}"

          if [ ! -f "$FILE" ]; then
            echo "$FILE 이(가) 없습니다"; exit 1
          fi

          # 구간 치환
          awk -v start="$START" -v end="$END" -v repl="$LIST" '
            BEGIN{insec=0}
            {
              if($0 ~ start){print $0; print repl; insec=1; next}
              if($0 ~ end){insec=0}
              if(!insec) print $0
            }' "$FILE" > README.tmp

          mv README.tmp "$FILE"

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update blog posts via rss2json"
          file_pattern: README.md
