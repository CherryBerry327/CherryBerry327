name: Update blog posts (rss2json)

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 UTC 00:00 (KST 09:00)
  workflow_dispatch:

permissions:
  contents: write  # README 커밋 권한

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build blog list with rss2json (via jq)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          FEED_URL="https://api.rss2json.com/v1/api.json?rss_url=https://cherryberry0327.tistory.com/rss"

          # RSS -> JSON
          JSON="$(curl -fsSL "$FEED_URL")"

          # 최근 5개 제목+링크를 마크다운 리스트로 생성
          LIST="$(echo "$JSON" | jq -r '.items[:5][] | "- [\(.title | gsub("\n";" ") )](\(.link))"')"

          # GitHub Actions 출력 변수로 전달
          {
            echo "list<<EOF"
            echo "$LIST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Inject into README
        shell: bash
        run: |
          set -euo pipefail
          FILE="README.md"
          START="<!-- BLOG-POST-LIST:START -->"
          END="<!-- BLOG-POST-LIST:END -->"
          LIST="${{ steps.build.outputs.list }}"

          awk -v start="$START" -v end="$END" -v repl="$LIST" '
            BEGIN{insec=0}
            {
              if($0 ~ start){print $0; print repl; insec=1; next}
              if($0 ~ end){insec=0}
              if(!insec) print $0
            }' "$FILE" > README.tmp

          mv README.tmp "$FILE"

      - name: Commit & Push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update blog posts via rss2json + jq"
          file_pattern: README.md
